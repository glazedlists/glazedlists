import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

apply plugin: 'com.gradleup.shadow'
apply plugin: 'org.openjfx.javafxplugin'

javafx {
    version = javafxVersion
    modules = [ 'javafx.controls', 'javafx.web' ]
}

dependencies {
    api project(':extensions:swt')
    api project(':extensions:treetable')
    api project(':extensions:jfreechart')
    api project(':extensions:javafx')
    api project(':extensions:nachocalendar')
    api project(':extensions:jgoodiesforms')
    api files('lib/http.jar')
    api 'org.kohsuke:github-api:1.111'
}

/**
 * Issues-Browser: runnable jar with all runtime dependencies merged in
 */
shadowJar {
    destinationDirectory = file("$rootDir/$targetDir")
    archiveFileName = "glazedlists-demo.jar"

    manifest {
        attributes 'Main-Class': 'com.publicobject.issuesbrowser.swing.IssuesBrowser'
    }
}

task issuesbrowserjar {
    group = 'Shadow'
    description = 'Builds the Issues-Browser demo jar (same as shadowJar).'
    dependsOn shadowJar
}

/**
 * XML-Browser: same content as the Issues-Browser jar, different main class
 */
task xmlbrowserjar(type: ShadowJar) {
    group = 'Shadow'
    description = 'Builds the XML-Browser demo jar.'
    destinationDirectory = file("$rootDir/$targetDir")
    archiveFileName = "xmlbrowser.jar"

    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    // the excludes the plugin intends for its shadowJar task
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'

    manifest {
        attributes 'Main-Class': 'com.publicobject.xmlbrowser.XmlBrowser'
    }
}
