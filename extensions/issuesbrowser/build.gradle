apply plugin: 'it.gianluz.capsule'

if (JavaVersion.current().compareTo(JavaVersion.VERSION_11) >= 0) {

    apply plugin: 'org.openjfx.javafxplugin'

    javafx {
        modules = [ 'javafx.controls', 'javafx.web' ]
    }
}

dependencies {
    api project(':extensions:swt')
    api project(':extensions:treetable')
    api project(':extensions:jfreechart')
    api project(':extensions:javafx')
    api project(':extensions:nachocalendar')
    api project(':extensions:jgoodiesforms')
    api files('lib/http.jar')
    api 'org.kohsuke:github-api:1.111'
}

/**
 * Issues-Browser
 */
task issuesbrowserjar(type: FatCapsule) {
    destinationDirectory = file("$rootDir/$targetDir")
    archiveFileName = "glazedlists-demo.jar"
    // FatCapsule embeds the legacy 'runtime' configuration by default, which no longer gets the 'api' dependencies
    embedConfiguration = configurations.runtimeClasspath

    applicationClass 'com.publicobject.issuesbrowser.swing.IssuesBrowser'

    capsuleManifest {
        applicationId = 'com.publicobject.issuesbrowser.swing.IssuesBrowser'
        applicationName = 'IssuesBrowser'
        minJavaVersion = '1.8.0'
    }
}

/**
 * XML-Browser
 */
task xmlbrowserjar(type: FatCapsule) {
    destinationDirectory = file("$rootDir/$targetDir")
    archiveFileName = "xmlbrowser.jar"
    embedConfiguration = configurations.runtimeClasspath

    applicationClass 'com.publicobject.xmlbrowser.XmlBrowser'

    capsuleManifest {
        applicationId = 'com.publicobject.xmlbrowser.XmlBrowser'
        applicationName = 'XmlBrowser'
        minJavaVersion = '1.8.0'
    }
}