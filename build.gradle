/**
 * settings and plugins for build
 */
buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        // The JavaFX plugin is built for Java 11, so Gradle refuses to resolve it on JDK 8.
        // It is only applied on JDK 11+ anyway (JDK 8 builds use the JavaFX bundled with the JDK).
        if (JavaVersion.current().isJava11Compatible()) {
            classpath "org.openjfx:javafx-plugin:0.1.0"
        }
    }
}

plugins {
    // provides the jar task for the merged OSGi jar (bnd); the root project has no sources of its own
    id "java"
    id "maven-publish"
    id "signing"
    id "biz.aQute.bnd.builder" version "6.4.0"
    id "com.github.johnrengelman.shadow" version "6.1.0" apply false
}

/**
 * group and version (artifact is set from rootProject.name in settings.gradle
 */
group = "com.glazedlists"
version = "$nextReleaseVersion${isSnapshot == "true" ? "-SNAPSHOT" : ""}"

/**
 * variables
 */
ext.targetDir = "target/"
ext.centralStagingDir = file("$targetDir/central-staging")
ext.user = System.getProperty("user.name")
ext.buildTime = new Date()
def exportedProjects = subprojects.findAll { it.name != 'issuesbrowser' && it.name != 'jmh-benchmark' }

/**
 * settings for all modules including root-module
 * (the root project resolves the classpath of the docs task)
 */
allprojects {
    repositories {
        mavenCentral()

        // for SWT
        maven {
            url = "https://maven-eclipse.github.io/maven"
        }
    }
}

/**
 * settings for subprojects = everything except the root-project
 */
subprojects {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.toVersion(javaTargetVersion)
        targetCompatibility = JavaVersion.toVersion(javaTargetVersion)
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
    }
    tasks.withType(Javadoc) {
        options.encoding = "UTF-8"
    }

    /* dependencies for test */
    dependencies {
        testImplementation 'junit:junit:4.11'
        testImplementation 'org.awaitility:awaitility:4.0.3'
        testImplementation 'org.assertj:assertj-core:3.16.1'
    }
    test {
        systemProperties 'java.awt.headless': 'true'
        maxHeapSize = "512m"

        if (project.hasProperty('excludeTests')) { 
            exclude project.property('excludeTests')
        } 

        testLogging {
            events "skipped", "failed"
            exceptionFormat = "full"
        }
    }

    jar.archiveFileName = "glazedlists-${name}.jar"
}

/**
 * settings for subprojects except core
 */
configure(subprojects.findAll { it.name != 'core' }) {
    /* everything depends on core */
    dependencies {
        api project(':core')
        testImplementation project(':core').sourceSets.test.output
    }
}

/**
 * add directories to clean of root-project
 */
clean.doLast {
    file(targetDir).deleteDir()
}


/**
 * JavaDoc
 */
configurations {
    /* the exported projects with their dependencies, resolved via project dependencies
       (as runtime jars, like the 'default' configuration that an attribute-less configuration resolves) */
    docsClasspath {
        canBeConsumed = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
}
dependencies {
    exportedProjects.each { docsClasspath project(it.path) }
}
if (JavaVersion.current().isJava11Compatible()) {
    /* The JavaFX plugin selects the platform jars (e.g. javafx-base-<version>-win.jar) only in projects it is applied to,
       through a component metadata rule and OS/architecture attributes on the source set classpaths.
       Applied here without modules, so the docs classpath can request the same platform. */
    apply plugin: 'org.openjfx.javafxplugin'
    [OperatingSystemFamily.OPERATING_SYSTEM_ATTRIBUTE, MachineArchitecture.ARCHITECTURE_ATTRIBUTE].each { attribute ->
        configurations.docsClasspath.attributes.attribute(attribute, configurations.compileClasspath.attributes.getAttribute(attribute))
    }
}

task docs(type: Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.jFlags('-Dhttp.agent=gradle-javadoc')
    classpath = configurations.docsClasspath
    source = exportedProjects.collect { it.sourceSets.main.allJava }
    destinationDir = file("$targetDir/docs/api")
    title = "Glazed Lists $version"
    exclude '**/impl/**'

    options {
        author true
        use = true
        bottom """<a href="http://www.glazedlists.com" target="_top">Glazed Lists</a>, Copyright &#169; 2003 publicobject.com, O&apos;Dell Engineering.<br>Documentation build by $user at $buildTime"""

        links(
            "http://docs.oracle.com/javase/8/docs/api/",
            "http://help.eclipse.org/neon/topic/org.eclipse.platform.doc.isv/reference/api/",
            "http://doc.formdev.com/jgoodies-forms/",
            "http://nachocalendar.sourceforge.net/apidocs/",
            "http://www.jfree.org/jfreechart/api/javadoc/",
	    "https://static.javadoc.io/org.swinglabs.swingx/swingx-all/1.6.5-1/",
            "https://docs.jboss.org/hibernate/orm/current/javadocs/"
        )
    }
}

/**
 * JavaDoc-Jar
 */
task javadocjar(type: Jar, dependsOn: "docs") {
    archiveClassifier = 'javadoc'
    destinationDirectory = file(targetDir)
    archiveFileName = "${rootProject.name}-${project.version}-javadoc.jar"
    from fileTree("$targetDir/docs/api")
}

/**
 * Source-Jar
 */
task sourcejar(type: Jar) {
    archiveClassifier = 'sources'
    destinationDirectory = file(targetDir)
    archiveFileName = "${rootProject.name}-${project.version}-sources.jar"
    includeEmptyDirs = false
    from files(
        subprojects.collect { it.sourceSets.main.allSource }
    )
}

/**
 * Jar (osgi compatible)
 */
jar {
    destinationDirectory = file(targetDir)
    archiveFileName = "${rootProject.name}-${project.version}.jar"

    apply from: 'glazedlists.bnd.gradle'
    bundle {
        bndfile = makeBNDFile()
    }

    from files(
        exportedProjects.collect { it.sourceSets.main.output }
    )
}

/**
 * Dist
 */
task dist(type: Zip) {
    /* fileTree uses ANT default excludes; settings.gradle removes .gitignore from them */
    destinationDirectory = file(targetDir)
    archiveFileName = "${rootProject.name}-${project.version}-dist.zip"
    includeEmptyDirs = false
    from fileTree(".") {
        exclude ".git"
        exclude ".github"
		exclude "azure-pipelines.yml"
		exclude "build-job.yml"
		exclude "RELEASING.md"
        exclude "www"
        exclude "**/.classpath"
        exclude "**/.project"
        exclude "**/.settings/*"
        file(".gitignore").eachLine {
            exclude it
        }
    }
}

/**
 * Build
 */
build.dependsOn(["jar", "sourcejar", "javadocjar", "dist"])

assemble.dependsOn javadocjar, sourcejar, dist

/**
 * Publishing: release versions go to the local repository target/central-staging and are published
 * via a Central Portal bundle (see centralBundle), snapshots go to the Portal snapshot repository
 */
publishing {
    publications {
        mavenJava(MavenPublication) {
            // explicit artifacts instead of components.java: no dependencies and no Gradle module metadata
            artifact jar
            artifact sourcejar
            artifact javadocjar
            artifact dist

            pom {
                // jar and dist zip both have no classifier, so Gradle can't derive the packaging
                packaging = "jar"
                name = "Glazed Lists"
                description = "Event-driven lists for dynamically filtered and sorted tables"
                url = "https://github.com/glazedlists/glazedlists"
                inceptionYear = "2003"

                licenses {
                    license {
                        name = "GNU Lesser General Public License"
                        url = "http://www.gnu.org/copyleft/lesser.html"
                        distribution = "repo"
                    }
                    license {
                        name = "Mozilla Public License Version 1.1"
                        url = "http://www.mozilla.org/MPL/MPL-1.1.html"
                        distribution = "repo"
                    }
                }

                developers {
                    developer {
                        id = "jessewilson"
                        name = "Jesse Wilson"
                        email = "jesse@swank.ca"
                        roles = ["Java developer"]
                        timezone = "PDT"
                    }
                    developer {
                        id = "jplemieux"
                        name = "James Lemieux"
                        email = ""
                        roles = ["Java developer"]
                        timezone = "PDT"
                    }
                    developer {
                        id = "kevinmaltby"
                        name = "Kevin Maltby"
                        email = ""
                        roles = ["Java developer"]
                        timezone = "EST"
                    }
                    developer {
                        id = "robeden"
                        name = "Rob Eden"
                        email = "robeden1@gmail.com"
                        roles = ["Java developer"]
                        timezone = "CST"
                    }
                    developer {
                        id = "brands"
                        name = "Holger Brands"
                        email = ""
                        roles = ["Java developer"]
                        timezone = "CET"
                    }
                }

                contributors {
                    contributor {
                        name = "Geoffrey De Smet"
                        email = "ge0ffrey.spam_AT_gmail.com"
                        roles = ["Maven2izer"]
                        timezone = "+1"
                    }
                    contributor {
                        name = "Fabian Zeindl"
                        email = ""
                        roles = ["Java developer"]
                        timezone = "CET"
                    }
                }

                scm {
                    connection = "scm:git:git://github.com/glazedlists/glazedlists"
                    developerConnection = "scm:git:git://github.com/glazedlists/glazedlists"
                    url = "https://github.com/glazedlists/glazedlists"
                }

                issueManagement {
                    system = "GitHub Issues"
                    url = "https://github.com/glazedlists/glazedlists/issues"
                }
            }
        }
    }

    repositories {
        maven {
            name = "central"
            if (isSnapshot == "true") {
                url = mavenSnapshotsRepositoryUrl
                credentials {
                    username = sonatypeUsername
                    password = sonatypePassword
                }
            } else {
                url = centralStagingDir.toURI()
            }
        }
    }
}

def publishToCentral = tasks.named("publishMavenJavaPublicationToCentralRepository")
publishToCentral.configure {
    doFirst {
        // a release bundle must not pick up stale files from an earlier run
        if (isSnapshot != "true") {
            project.delete(centralStagingDir)
        }
    }
}

signing {
    required { gradle.taskGraph.hasTask(":publishMavenJavaPublicationToCentralRepository") }

    sign publishing.publications.mavenJava
}

/**
 * Central Portal bundle: zips the signed release artifacts of the local staging repository
 * for upload to https://central.sonatype.com (see RELEASING.md)
 */
task centralBundle(type: Zip, dependsOn: publishToCentral) {
    def versionPath = "${project.group.replace('.', '/')}/${rootProject.name}/${project.version}"
    destinationDirectory = file(targetDir)
    archiveFileName = "${rootProject.name}-${project.version}-central-bundle.zip"
    from(centralStagingDir) {
        include "$versionPath/**"
    }

    doFirst {
        def versionDir = new File(centralStagingDir, versionPath)
        def prefix = "${rootProject.name}-${project.version}"
        ["${prefix}.pom", "${prefix}.jar", "${prefix}-sources.jar", "${prefix}-javadoc.jar"].each { name ->
            if (!new File(versionDir, name).exists()) {
                throw new GradleException("Missing $name in $versionDir")
            }
        }
        // Gradle 6+ also writes .sha256/.sha512 files
        versionDir.listFiles().findAll { !(it.name ==~ /.*\.(asc|md5|sha1|sha256|sha512)/) }.each { artifact ->
            [".asc", ".md5", ".sha1"].each { ext ->
                if (!new File(versionDir, artifact.name + ext).exists()) {
                    throw new GradleException("Missing ${artifact.name}$ext in $versionDir")
                }
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(centralBundle) && isSnapshot == "true") {
        throw new GradleException("centralBundle needs a release version: run with -PisSnapshot=false")
    }
}
