apply plugin: 'it.gianluz.capsule'

dependencies {
    api project(':core')
    api "org.openjdk.jmh:jmh-core:1.19"

    annotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:1.19"
}

task capsule(type: FatCapsule) {
    destinationDirectory = file("$buildDir/capsule")
    archiveFileName = "glazedlists-benchmarks.jar"
    // FatCapsule embeds the legacy 'runtime' configuration by default, which no longer gets the 'api' dependencies
    embedConfiguration = configurations.runtimeClasspath
    applicationClass 'ca.odell.glazedlists.BenchmarkMain'

    capsuleManifest {
        applicationId = 'ca.odell.glazedlists.BenchmarkMain'
        minJavaVersion = '1.8.0'
    }
}
