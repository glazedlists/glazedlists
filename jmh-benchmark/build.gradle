apply plugin: 'com.github.johnrengelman.shadow'

dependencies {
    api project(':core')
    api "org.openjdk.jmh:jmh-core:1.19"

    annotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:1.19"
}

/**
 * runnable benchmark jar with all runtime dependencies merged in (see benchmark.sh/benchmark.bat)
 */
shadowJar {
    archiveFileName = "glazedlists-benchmarks.jar"
    // Shadow 6.1.0's own default exclude is broken (relocated to 'shadow.module-info.class')
    exclude 'module-info.class'

    manifest {
        attributes 'Main-Class': 'ca.odell.glazedlists.BenchmarkMain'
    }
}
