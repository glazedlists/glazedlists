name: Java CI

on: [push]

jobs:
  build:
    env:
      DISPLAY: :1
    strategy:
      matrix:
        # macOS: Intel runner, because Gradle 5.3.1 predates Apple Silicon support
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        java: [8, 11]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: ${{ matrix.java }}
        java-package: jdk+fx
    - name: Install and start window manager (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install xvfb
        sudo apt-get install metacity
        Xvfb :1 &
        sleep 5
        metacity --sm-disable --replace 2> metacity.err &
      if: matrix.os == 'ubuntu-latest'
    - name: Build with Gradle (Linux)
      run: ./gradlew build
      if: matrix.os == 'ubuntu-latest'
    - name: Build with Gradle (Windows)
      run: ./gradlew build -PexcludeTests=**/CTPConnectionTest*
      shell: bash
      if: matrix.os == 'windows-latest'
    - name: Build with Gradle (MacOS)
      run: ./gradlew build -x :extensions:swt:test
      if: matrix.os == 'macos-15-intel'
