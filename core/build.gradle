import javax.inject.Inject

/**
 * M4 generation
 */
interface InjectedExecOperations {
    @Inject
    ExecOperations getExecOperations()
}

task m4 {
    def execOperations = objects.newInstance(InjectedExecOperations).execOperations

    doLast {

        def extension = ["Node", "Tree", "TreeAsList", "TreeIterator"]
        def dir = "$rootDir/core/src/main/java/ca/odell/glazedlists/impl/adt/barcode2"

        extension.each { ext ->
            new File("$dir/FourColor${ext}.java_intermediate").withOutputStream { output ->
                execOperations.exec {
                    workingDir dir
                    commandLine 'm4', '--prefix-builtins',
                        '-DVAR_COLOUR_COUNT=4',
                        '-DVAR_WIDE_NODES=true',
                        '-DVAR_TYPE_COUNT=1',
                        "Bcii${ext}.java"

                    standardOutput = output
                }
            }
        }

        extension.each { ext ->
            new File("$dir/FourColor${ext}.java").withOutputStream { output ->
                execOperations.exec {
                    workingDir dir
                    commandLine 'm4', '--prefix-builtins',
                        '-DBciiTree=FourColorTree',
                        '-DBciiNode=FourColorNode',
                        '-DBciiTreeAsList=FourColorTreeAsList',
                        '-DBciiTreeIterator=FourColorTreeIterator',
                        '-DCOMMAPLACEHOLDER=,',
                        "FourColor${ext}.java_intermediate"

                    standardOutput = output
                }
            }
        }

        extension.each { ext ->
            new File("$dir/FourColorTwoValue${ext}.java_intermediate").withOutputStream { output ->
                execOperations.exec {
                    workingDir dir
                    commandLine 'm4', '--prefix-builtins',
                        '-DVAR_COLOUR_COUNT=4',
                        '-DVAR_WIDE_NODES=true',
                        '-DVAR_TYPE_COUNT=2',
                        "Bcii${ext}.java"

                    standardOutput = output
                }
            }
        }

        extension.each { ext ->
            new File("$dir/FourColorTwoValue${ext}.java").withOutputStream { output ->
                execOperations.exec {
                    workingDir dir
                    commandLine 'm4', '--prefix-builtins',
                        '-DBciiTree=FourColorTwoValueTree',
                        '-DBciiNode=FourColorTwoValueNode',
                        '-DBciiTreeAsList=FourColorTwoValueTreeAsList',
                        '-DBciiTreeIterator=FourColorTwoValueTreeIterator',
                        '-DCOMMAPLACEHOLDER=,',
                        "FourColorTwoValue${ext}.java_intermediate"

                    standardOutput = output
                }
            }
        }

        extension.each { ext ->
            new File("$dir/Simple${ext}.java_intermediate").withOutputStream { output ->
                execOperations.exec {
                    workingDir dir
                    commandLine 'm4', '--prefix-builtins',
                        '-DVAR_COLOUR_COUNT=1',
                        '-DVAR_WIDE_NODES=false',
                        '-DVAR_TYPE_COUNT=1',
                        "Bcii${ext}.java"

                    standardOutput = output
                }
            }
        }

        extension.each { ext ->
            new File("$dir/Simple${ext}.java").withOutputStream { output ->
                execOperations.exec {
                    workingDir dir
                    commandLine 'm4', '--prefix-builtins',
                        '-DBciiTree=SimpleTree',
                        '-DBciiNode=SimpleNode',
                        '-DBciiTreeAsList=SimpleTreeAsList',
                        '-DBciiTreeIterator=SimpleTreeIterator',
                        '-DCOMMAPLACEHOLDER=,',
                        "Simple${ext}.java_intermediate"

                    standardOutput = output
                }
            }
        }

        delete fileTree(dir) {
            include '**/*_intermediate'
        }
    }
}